<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitView 1.0 示例</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <div id="container">
      <div class="screen">
        <div class="header">
          <div class="left"></div>
          <div class="title">数字化智能管理系统</div>
          <div class="right">
            <img src="./imgs/msg.png" alt="" />
          </div>
        </div>
        <div class="body">
          <div class="left" id="chart1"></div>
          <div class="right">
            <div class="r-top">
              <div class="r-t-left" id="chart2"></div>
              <div class="r-t-right" id="chart3"></div>
            </div>
            <div class="r-bot" id="chart4"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="fit-radio-group">
        <input type="radio" id="fit-fill" name="fitMode" value="fill" />
        <label for="fit-fill">填充 fill</label>
        <input
          type="radio"
          id="fit-contain"
          name="fitMode"
          value="contain"
          checked
        />
        <label for="fit-contain">包含 contain</label>
        <input type="radio" id="fit-scroll" name="fitMode" value="scroll" />
        <label for="fit-scroll">滚动 scroll</label>
        <input type="radio" id="fit-hidden" name="fitMode" value="hidden" />
        <label for="fit-hidden">隐藏 hidden</label>
      </div>
      <button id="destroyBtn">销毁实例</button>
      <div id="info"></div>
    </div>
    <div id="resizeHandle"></div>
    <script src="./js/echarts.min.js"></script>
    <script src="../lib/fitview.umd.js"></script>
    <script src="./js/ec.js"></script>
    <script>
      const container = document.getElementById("container");
      const info = document.getElementById("info");

      // 创建控制器：mode 适配模式、watch 默认 true 监听尺寸变化、onResize 尺寸变化回调
      let fv = FitView.createFitView({
        el: container,
        mode: "contain",
        // 显式设计稿尺寸示例（注释掉默认取子元素尺寸）：
        // designWidth: 1920,
        // designHeight: 1080,
        onResize: (res) => {
          info.innerText =
            `容器 ${res.width}×${res.height} 缩放 ` +
            `${res.scaleX.toFixed(3)}×${res.scaleY.toFixed(3)} 模式 ${res.mode}`;
        },
      });

      // 模式切换：直接 setMode，无需销毁重建
      document.querySelectorAll('input[name="fitMode"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          fv.setMode(radio.value);
        });
      });

      // 拖拽调整容器尺寸
      let startX, startY, startWidth, startHeight;
      const resizeHandle = document.getElementById("resizeHandle");

      resizeHandle.addEventListener("mousedown", (e) => {
        startX = e.clientX;
        startY = e.clientY;
        startWidth = container.offsetWidth;
        startHeight = container.offsetHeight;
        document.addEventListener("mousemove", resize);
        document.addEventListener("mouseup", stopResize);
        e.preventDefault();
      });

      function resize(e) {
        const width = startWidth + (e.clientX - startX);
        const height = startHeight + (e.clientY - startY);
        container.style.width = `${width}px`;
        container.style.height = `${height}px`;
        resizeHandle.style.top = `${height - 15}px`;
        resizeHandle.style.left = `${width - 5}px`;
      }

      function stopResize() {
        document.removeEventListener("mousemove", resize);
        document.removeEventListener("mouseup", stopResize);
      }

      // 销毁实例，断开尺寸监听
      document.getElementById("destroyBtn").addEventListener("click", () => {
        fv.destroy();
        document.getElementById("destroyBtn").disabled = true;
        info.innerText = "实例已销毁，尺寸监听已断开";
      });
    </script>
  </body>
</html>
